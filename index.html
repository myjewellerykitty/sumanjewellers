<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Rose Magic - Suman Jewellers</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .hidden-view { display: none !important; }
        .overflow-x-auto { -webkit-overflow-scrolling: touch; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-toast { animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .active-press:active { transform: scale(0.96); filter: brightness(0.92); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-[99999] flex flex-col items-center gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <div id="loadingOverlay" class="hidden-view fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-start justify-center pt-6 px-3 z-50">
        <div class="bg-white rounded-2xl py-3 px-5 shadow-2xl border border-amber-300 flex items-center gap-3.5 max-w-sm w-full">
            <div class="w-6 h-6 border-3 border-amber-200 border-t-amber-800 rounded-full animate-spin shrink-0"></div>
            <p id="loadingMessage" class="text-xs font-bold text-slate-900 uppercase">Processing...</p>
        </div>
    </div>

    <div id="customerView" class="max-w-md mx-auto w-full p-3 sm:p-4 flex-1">
        <header class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-4">
            <img src="https://i.pinimg.com/736x/e0/2d/25/e02d25f6a4cfc5970b015b7a951fa722.jpg" alt="Banner" class="w-full h-28 object-cover">
            <div class="p-3 text-center relative pt-8">
                <div class="absolute -top-8 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full border-2 border-amber-400 shadow-md bg-white p-1 flex items-center justify-center">
                    <img src="https://i.pinimg.com/736x/de/1e/3c/de1e3cbb5a80e01aae5e2340602dc02c.jpg" alt="Logo" class="w-full h-full object-contain">
                </div>
                <h1 class="text-lg font-black uppercase text-slate-900">Golden Rose Magic</h1>
                <p class="text-xs font-semibold text-amber-700">For Easy Jewellery Purchase (11 Months)</p>
            </div>
        </header>

        <div id="authContainer">
            <div id="phoneSection" class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 mb-4 space-y-3">
                <label class="text-[11px] font-bold text-slate-600 uppercase block">Registered Mobile Number</label>
                <input type="tel" id="phoneInput" placeholder="Enter 10-Digit Mobile Number" maxlength="10" class="w-full px-3.5 py-3 bg-slate-50 border rounded-xl text-sm font-mono focus:bg-white">
                <button onclick="handlePhoneContinue()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl text-xs uppercase cursor-pointer active-press">Access Passbook</button>
            </div>

            <div id="mpinLoginSection" class="hidden-view bg-white rounded-2xl shadow-sm p-4 border border-slate-200 mb-4 space-y-3">
                <p class="text-xs text-center text-slate-500">Mobile: <strong id="lblMpinPhone" class="text-slate-800 font-mono"></strong></p>
                <input type="password" id="mpinInput" placeholder="••••" maxlength="4" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-center font-mono text-2xl font-bold">
                <button onclick="verifyMpinAndProceed()" class="w-full bg-[#800020] text-white font-bold py-3.5 rounded-xl text-xs uppercase cursor-pointer active-press">Verify MPIN</button>
                <button onclick="resetToPhoneStep()" class="text-xs text-slate-400 hover:text-slate-600 block mx-auto cursor-pointer">← Change Phone</button>
            </div>

            <div id="firstTimeMpinSection" class="hidden-view bg-white rounded-2xl shadow-sm p-4 border border-slate-200 mb-4 space-y-3">
                <p class="text-xs text-center text-slate-500">Create your 4-digit Security MPIN</p>
                <input type="password" id="firstMpin1" placeholder="Enter 4-Digit MPIN" maxlength="4" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-center font-mono text-lg font-bold">
                <input type="password" id="firstMpin2" placeholder="Confirm 4-Digit MPIN" maxlength="4" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-center font-mono text-lg font-bold">
                <button onclick="saveInitialMpin()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl text-xs uppercase cursor-pointer active-press">Save & Access</button>
            </div>

            <div id="multiKittyWrapper" class="hidden-view bg-amber-50 p-4 rounded-2xl border border-amber-200 space-y-3 mb-4">
                <label class="text-[11px] font-bold text-amber-900 uppercase block">Select Linked Account</label>
                <select id="kittySelect" class="w-full px-3 py-2.5 bg-white border rounded-xl text-sm font-semibold"></select>
                <button onclick="confirmSelectedKitty()" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-xs cursor-pointer active-press">Open Account</button>
            </div>
        </div>

        <div id="passbookContainer" class="hidden-view space-y-4">
            <div class="bg-slate-900 text-white rounded-2xl p-4 border border-slate-800 space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 id="custName" class="text-base font-bold uppercase">-</h3>
                        <p id="custPhone" class="text-xs text-slate-400 font-mono">-</p>
                    </div>
                    <button onclick="logoutCustomer()" class="text-[10px] bg-slate-800 text-slate-300 px-2.5 py-1 rounded cursor-pointer active-press">Logout</button>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800">
                    <div><span class="text-[10px] text-slate-400 uppercase block">Monthly Plan</span><span id="custAmount" class="text-sm font-black font-mono">₹0</span></div>
                    <div class="text-right"><span class="text-[10px] text-slate-400 uppercase block">Total Principal</span><span id="custLiveBalance" class="text-sm font-black text-amber-400 font-mono">₹0</span></div>
                </div>
            </div>

            <div class="bg-white border rounded-2xl p-4 text-center">
                <span class="text-xs uppercase font-bold text-slate-500 block mb-1">Accumulated 22K Gold Weight</span>
                <span id="lblTotalGoldGrams" class="text-2xl font-black font-mono text-slate-900">0.0000 g</span>
            </div>

            <div class="bg-white rounded-2xl p-4 border shadow-sm">
                <p class="text-[11px] font-bold text-slate-700 uppercase mb-3">Installment Ledger (11 Months)</p>
                <div id="gridWrapper" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        const EXPIRY_TIME = new Date("2027-09-18T23:59:59+05:30").getTime();
        if (Date.now() > EXPIRY_TIME) {
            document.body.innerHTML = "<div class='min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-6 text-center'><h1 class='text-xl font-bold uppercase text-rose-500'>Portal Expired</h1><p class='text-xs text-slate-400 mt-2'>License expired on 18/09/2027.</p></div>";
        }

        const config = {
            upiVpa: "vyapar.178552646415@hdfcbank",
            scriptUrl: "https://script.google.com/macros/s/AKfycbyds-Y0vhWOc4S2HnQUQGaiuKRo3n_F8vL8LiVsfw0hEZpEvKjubDosJNxv-_xwotkoEQ/exec"
        };

        let curPhone = null, curAc = null, curAmt = 0, matches = [];

        function notify(msg, type = "info") {
            const box = document.getElementById("toastContainer");
            const t = document.createElement("div");
            t.className = "w-full px-4 py-3 rounded-2xl shadow-xl border text-xs font-semibold animate-toast " + (type === "error" ? "bg-rose-950 text-rose-100 border-rose-700" : "bg-slate-900 text-slate-100 border-slate-700");
            t.innerText = msg;
            box.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }
        window.alert = (m) => notify(m, m.toLowerCase().includes("error") || m.toLowerCase().includes("invalid") ? "error" : "info");

        function showLoader(m = "Loading...") {
            document.getElementById("loadingMessage").innerText = m;
            document.getElementById("loadingOverlay").classList.remove("hidden-view");
        }
        function hideLoader() { document.getElementById("loadingOverlay").classList.add("hidden-view"); }

        function fetchFast(url) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 7000);
            return fetch(url, { signal: controller.signal })
                .then(r => { clearTimeout(id); return r.json(); })
                .catch(e => { clearTimeout(id); throw e; });
        }

        function handlePhoneContinue() {
            const p = document.getElementById("phoneInput").value.replace(/\D/g, "").slice(-10);
            if (p.length < 10) return alert("Enter valid 10-digit mobile number");

            showLoader("Verifying...");
            curPhone = p;

            fetchFast(`${config.scriptUrl}?action=checkCustomer&phone=${p}&_ts=${Date.now()}`)
                .then(res => {
                    hideLoader();
                    if (!res.success) return alert(res.error || "Account not found");
                    document.getElementById("phoneSection").classList.add("hidden-view");
                    if (res.hasMpin) {
                        document.getElementById("lblMpinPhone").innerText = "+91 " + p;
                        document.getElementById("mpinLoginSection").classList.remove("hidden-view");
                    } else {
                        document.getElementById("firstTimeMpinSection").classList.remove("hidden-view");
                    }
                })
                .catch(() => { hideLoader(); alert("Server took too long to respond. Please try again."); });
        }

        function verifyMpinAndProceed() {
            const m = document.getElementById("mpinInput").value.trim();
            if (m.length !== 4) return alert("Enter 4-digit MPIN");

            showLoader("Authenticating...");
            fetchFast(`${config.scriptUrl}?action=loginMpin&phone=${curPhone}&mpin=${m}&_ts=${Date.now()}`)
                .then(res => {
                    hideLoader();
                    if (res.success) {
                        document.getElementById("mpinLoginSection").classList.add("hidden-view");
                        fetchProfile(curPhone);
                    } else alert(res.error || "Incorrect MPIN");
                })
                .catch(() => { hideLoader(); alert("Network timeout. Try again."); });
        }

        function saveInitialMpin() {
            const p1 = document.getElementById("firstMpin1").value.trim();
            const p2 = document.getElementById("firstMpin2").value.trim();
            if (p1.length !== 4 || p1 !== p2) return alert("Pins must match and be 4 digits");

            showLoader("Saving PIN...");
            fetchFast(`${config.scriptUrl}?action=setInitialMpin&phone=${curPhone}&mpin=${p1}&_ts=${Date.now()}`)
                .then(res => {
                    hideLoader();
                    if (res.success) {
                        document.getElementById("firstTimeMpinSection").classList.add("hidden-view");
                        fetchProfile(curPhone);
                    } else alert("Failed to save PIN");
                })
                .catch(() => { hideLoader(); alert("Network timeout"); });
        }

        function fetchProfile(phone) {
            showLoader("Opening Passbook...");
            fetchFast(`${config.scriptUrl}?action=searchMembers&query=${phone}&_ts=${Date.now()}`)
                .then(res => {
                    hideLoader();
                    matches = res.results || [];
                    if (!matches.length) return alert("No active plan linked");

                    if (matches.length === 1) {
                        document.getElementById("authContainer").classList.add("hidden-view");
                        loadPassbook(phone, matches[0].acCode);
                    } else {
                        const sel = document.getElementById("kittySelect");
                        sel.innerHTML = "";
                        matches.forEach(item => sel.innerHTML += `<option value="${item.acCode}">A/C: ${item.acCode} - ${item.name}</option>`);
                        document.getElementById("multiKittyWrapper").classList.remove("hidden-view");
                    }
                })
                .catch(() => { hideLoader(); alert("Failed to load profile"); });
        }

        function confirmSelectedKitty() {
            const ac = document.getElementById("kittySelect").value;
            document.getElementById("authContainer").classList.add("hidden-view");
            loadPassbook(curPhone, ac);
        }

        function loadPassbook(phone, ac) {
            showLoader("Loading Statement...");
            fetchFast(`${config.scriptUrl}?action=getData&phone=${phone}&kittyNumber=${ac}&_ts=${Date.now()}`)
                .then(res => {
                    hideLoader();
                    const p = res.profile;
                    if (!p) return alert("Unable to load profile data");

                    curAmt = p.monthlyAmount || 0;
                    document.getElementById("custName").innerText = p.name;
                    document.getElementById("custPhone").innerText = "+91 " + p.phone;
                    document.getElementById("custAmount").innerText = "₹" + curAmt.toLocaleString("en-IN");

                    const txs = res.transactions || [];
                    let paidCount = 0, totalGrams = 0;

                    txs.forEach(t => {
                        if (t.status === "Paid") {
                            paidCount++;
                            totalGrams += parseFloat(t.bookedGrams) || 0;
                        }
                    });

                    document.getElementById("custLiveBalance").innerText = "₹" + (paidCount * curAmt).toLocaleString("en-IN");
                    document.getElementById("lblTotalGoldGrams").innerText = totalGrams.toFixed(4) + " g";

                    const grid = document.getElementById("gridWrapper");
                    grid.innerHTML = "";
                    for (let m = 1; m <= 11; m++) {
                        const t = txs.find(x => Number(x.month) === m);
                        let label = "Unpaid", cls = "bg-slate-100 text-slate-400";
                        if (t && t.status === "Paid") {
                            label = `<span class="font-bold text-emerald-800">${parseFloat(t.bookedGrams).toFixed(4)}g</span><span class="text-[9px] block text-slate-500">${t.date ? t.date.split(" ")[0] : ""}</span>`;
                            cls = "bg-emerald-50 border border-emerald-200 text-emerald-800";
                        } else if (t && (t.status === "Pending" || t.status === "Reviewed")) {
                            label = "In Review";
                            cls = "bg-amber-50 border border-amber-200 text-amber-800";
                        }
                        grid.innerHTML += `<div class="p-2 rounded-xl text-center text-xs ${cls}"><span class="block text-[9px] font-bold text-slate-400">Month ${m}</span>${label}</div>`;
                    }

                    document.getElementById("passbookContainer").classList.remove("hidden-view");
                })
                .catch(() => { hideLoader(); alert("Failed to fetch statement"); });
        }

        function resetToPhoneStep() {
            document.getElementById("mpinLoginSection").classList.add("hidden-view");
            document.getElementById("phoneSection").classList.remove("hidden-view");
        }

        function logoutCustomer() {
            document.getElementById("passbookContainer").classList.add("hidden-view");
            document.getElementById("authContainer").classList.remove("hidden-view");
            document.getElementById("phoneSection").classList.remove("hidden-view");
            document.getElementById("phoneInput").value = "";
        }
    </script>
</body>
</html>
